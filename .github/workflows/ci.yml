name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest ruff mypy
      - run: make check
      - run: make replay
      - run: python -m triage.evaluate --graph --mode rules
      - run: kubectl kustomize ops > /tmp/oncall-manifests.yaml
  oom-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: oncall
      - run: make demo
      - name: Wait for demo telemetry
        run: |
          for component in prometheus alertmanager kube-state postgres redis shop; do
            kubectl -n oncall rollout status "deployment/$component" --timeout=120s
          done
          sleep 15
      - run: make eval EVAL_ARGS='--fault oom --timeout 90'
      - if: failure()
        run: |
          kubectl -n oncall get pods -o wide
          kubectl -n oncall logs deployment/triage --tail=50
          kubectl -n oncall logs deployment/prometheus --tail=50
          kubectl -n oncall logs deployment/alertmanager --tail=50

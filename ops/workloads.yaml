---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "triage"
  },
  "spec": {
    "selector": {
      "app": "triage"
    },
    "ports": [
      {
        "port": 8000
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "triage"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "triage"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "triage"
        }
      },
      "spec": {
        "automountServiceAccountToken": true,
        "containers": [
          {
            "name": "triage",
            "image": "oncall-demo:local",
            "imagePullPolicy": "IfNotPresent",
            "resources": {
              "limits": {
                "memory": "384Mi",
                "cpu": "500m"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              }
            },
            "command": [
              "uvicorn",
              "triage.api:app",
              "--host",
              "0.0.0.0",
              "--timeout-keep-alive",
              "5"
            ],
            "ports": [
              {
                "containerPort": 8000
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8000
              }
            },
            "volumeMounts": [
              {
                "name": "reports",
                "mountPath": "/reports"
              }
            ],
            "env": [
              {
                "name": "REPORT_DIR",
                "value": "/reports"
              },
              {
                "name": "WEBHOOK_TOKEN",
                "value": "local-demo-token"
              }
            ]
          }
        ],
        "serviceAccountName": "triage",
        "securityContext": {
          "fsGroup": 65532
        },
        "volumes": [
          {
            "name": "reports",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "traffic"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "traffic"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "traffic"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "traffic",
            "image": "curlimages/curl:8.14.1",
            "imagePullPolicy": "IfNotPresent",
            "resources": {
              "limits": {
                "memory": "64Mi",
                "cpu": "500m"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              }
            },
            "command": [
              "sh",
              "-c",
              "while true; do curl -fsS --max-time 3 -X POST http://shop:8000/orders || true; sleep 0.2; done"
            ]
          }
        ]
      }
    }
  }
}

{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "shop"
  },
  "spec": {
    "selector": {
      "app": "shop"
    },
    "ports": [
      {
        "port": 8000
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "shop"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "shop"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "shop"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "shop",
            "image": "oncall-demo:local",
            "imagePullPolicy": "IfNotPresent",
            "resources": {
              "limits": {
                "memory": "192Mi",
                "cpu": "100m"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              }
            },
            "command": [
              "uvicorn",
              "shop.api:app",
              "--host",
              "0.0.0.0"
            ],
            "ports": [
              {
                "containerPort": 8000
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8000
              }
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "worker"
  },
  "spec": {
    "selector": {
      "app": "worker"
    },
    "ports": [
      {
        "port": 8000
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "worker"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "worker"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "worker"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "worker",
            "image": "oncall-demo:local",
            "imagePullPolicy": "IfNotPresent",
            "resources": {
              "limits": {
                "memory": "128Mi",
                "cpu": "500m"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              }
            },
            "command": [
              "python",
              "-m",
              "shop.worker"
            ],
            "ports": [
              {
                "containerPort": 8000
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8000
              }
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "selector": {
      "app": "postgres"
    },
    "ports": [
      {
        "port": 5432
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "postgres"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "postgres"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "postgres",
            "image": "postgres:17-alpine",
            "imagePullPolicy": "IfNotPresent",
            "resources": {
              "limits": {
                "memory": "256Mi",
                "cpu": "500m"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              }
            },
            "ports": [
              {
                "containerPort": 5432
              }
            ],
            "env": [
              {
                "name": "POSTGRES_DB",
                "value": "shop"
              },
              {
                "name": "POSTGRES_USER",
                "value": "shop"
              },
              {
                "name": "POSTGRES_PASSWORD",
                "value": "shop"
              }
            ]
          }
        ]
      }
    }
  }
}

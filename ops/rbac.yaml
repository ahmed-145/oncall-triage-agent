apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evidence-reader
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evidence-reader
subjects:
  - kind: ServiceAccount
    name: triage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evidence-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-reader
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-reader
subjects:
  - kind: ServiceAccount
    name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oncall-cadvisor-reader
rules:
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oncall-cadvisor-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: oncall
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oncall-cadvisor-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-reader
subjects:
  - kind: ServiceAccount
    name: kube-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evidence-reader

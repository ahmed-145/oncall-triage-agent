groups:
  - name: shop
    rules:
      - alert: ShopHighErrorRate
        expr: sum(rate(shop_requests_total{status=~"5.."}[30s])) / sum(rate(shop_requests_total[30s])) > 0.15
        for: 5s
      - alert: ShopHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(shop_request_duration_seconds_bucket[30s]))) > 0.35
        for: 5s
      - alert: ShopRestarting
        expr: max_over_time(kube_pod_container_status_last_terminated_reason{namespace="oncall",container="shop",reason="OOMKilled"}[30s]) == 1 or kube_pod_container_status_waiting_reason{namespace="oncall",container="shop",reason="CrashLoopBackOff"} == 1
      - alert: ShopMemoryNearLimit
        expr: container_memory_working_set_bytes{namespace="oncall",container="shop"} > 167772160
      - alert: ShopDatabasePoolExhausted
        expr: increase(shop_fault_events_total{signal="pool_full"}[30s]) > 0
      - alert: ShopCPUThrottled
        expr: rate(container_cpu_cfs_throttled_periods_total{namespace="oncall",container="shop"}[30s]) / rate(container_cpu_cfs_periods_total{namespace="oncall",container="shop"}[30s]) > 0.5
        for: 5s

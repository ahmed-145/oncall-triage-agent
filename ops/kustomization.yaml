apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oncall
resources:
  - namespace.yaml
  - workloads.yaml
  - rbac.yaml
  - monitoring.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml, rules.yml]
  - name: alertmanager-config
    files: [alertmanager.yml]
  - name: alloy-config
    files: [config.alloy]
  - name: grafana-config
    files: [datasource.yml, provider.yml]
  - name: grafana-dashboard
    files: [dashboard.json]

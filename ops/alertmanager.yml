route:
  receiver: triage
  group_by: [alertname]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 5m
receivers:
  - name: triage
    webhook_configs:
      - url: http://triage:8000/alerts
        send_resolved: false
        http_config:
          authorization:
            credentials: local-demo-token

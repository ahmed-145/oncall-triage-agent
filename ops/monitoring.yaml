            },
            "args": [
              "run",
              "/config/config.alloy"
            ],
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/config",
                "readOnly": true
              }
            ]
          }
        ],
        "automountServiceAccountToken": true,
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "alloy-config"
            }
          }
        ],
        "serviceAccountName": "alloy"
      }
    }
  }
}

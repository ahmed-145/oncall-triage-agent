---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "kube-state"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "kube-state"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "kube-state"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "kube-state",
            "image": "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "resources": {
              "limits": {
                "memory": "512Mi",
                "cpu": "1"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              }
            },
            "args": [
              "--namespaces=oncall",
              "--resources=pods"
            ]
          }
        ],
        "automountServiceAccountToken": true,
        "serviceAccountName": "kube-state"
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "kube-state"
  },
  "spec": {
    "selector": {
      "app": "kube-state"
    },
    "ports": [
      {
        "port": 8080
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "grafana"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "grafana"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "grafana"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "grafana",
            "image": "grafana/grafana:12.1.1",
            "ports": [
              {
                "containerPort": 3000
              }
            ],
            "resources": {
              "limits": {
                "memory": "512Mi",
                "cpu": "1"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "grafana-config",
                "mountPath": "/etc/grafana/provisioning"
              },
              {
                "name": "grafana-dashboard",
                "mountPath": "/var/lib/grafana/dashboards"
              }
            ]
          }
        ],
        "automountServiceAccountToken": false,
        "volumes": [
          {
            "name": "grafana-config",
            "configMap": {
              "name": "grafana-config",
              "items": [
                {
                  "key": "datasource.yml",
                  "path": "datasources/local.yml"
                },
                {
                  "key": "provider.yml",
                  "path": "dashboards/local.yml"
                }
              ]
            }
          },
          {
            "name": "grafana-dashboard",
            "configMap": {
              "name": "grafana-dashboard"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "grafana"
  },
  "spec": {
    "selector": {
      "app": "grafana"
    },
    "ports": [
      {
        "port": 3000
      }
    ]
  }
}

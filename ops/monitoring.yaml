{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "prometheus"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "prometheus"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "prometheus"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "prometheus",
            "image": "prom/prometheus:v3.5.0",
            "ports": [
              {
                "containerPort": 9090
              }
            ],
            "resources": {
              "limits": {
                "memory": "512Mi",
                "cpu": "1"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              }
            },
            "args": [
              "--config.file=/config/prometheus.yml",
              "--storage.tsdb.retention.time=2h"
            ],
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/config",
                "readOnly": true
              }
            ]
          }
        ],
        "automountServiceAccountToken": true,
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "prometheus-config"
            }
          }
        ],
        "serviceAccountName": "prometheus"
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "prometheus"
  },
  "spec": {
    "selector": {
      "app": "prometheus"
    },
    "ports": [
      {
        "port": 9090
      }
    ]
  }
}

  },
  "spec": {
    "selector": {
      "matchLabels": {
        "app": "alloy"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "alloy"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "alloy",
            "image": "grafana/alloy:v1.10.2",
            "ports": [
              {
                "containerPort": 12345
              }
            ],
            "resources": {
              "limits": {
                "memory": "512Mi",
                "cpu": "1"
              },
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
